name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # Uncomment once the existing lint warnings are cleared.
      # - name: Lint
      #   working-directory: frontend
      #   run: npm run lint

  backend:
    name: Backend import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Every field in app/config.py has a default, so this imports
      # cleanly without secrets. It proves the FastAPI app and every
      # route module it pulls in are syntactically valid and that
      # requirements.txt covers what the code actually imports.
      - name: Import app
        working-directory: backend
        run: python -c "from app.main import app; print('app imported OK')"

      # Uncomment when the first tests land.
      # - name: Tests
      #   working-directory: backend
      #   run: pytest
